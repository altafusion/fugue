name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Started by the Release workflow on the changeset-release/main branch, whose pull_request runs need manual approval.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Full install: the template postinstall hooks run `nuxt prepare`, which the lint step needs.
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm test
