name: Release

on:
  push:
    branches: [ main ]
  # Lets a release be retried from the Actions tab (runs that fail to start cannot be re-run).
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # npm trusted publishing and provenance authenticate with the workflow OIDC token (no npm token).
  id-token: write

jobs:
  release:
    name: Version PR or publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # No scripts: nothing here builds an app. Publishing only needs the workspace manifests and the Changesets CLI.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # v2 is the line that works with @changesets/cli v3. v1 looked for "New tag:" in the publish output, which the
      # v3 CLI no longer prints, so it published but created no GitHub releases.
      # `changeset publish` creates the tags on the runner and the action pushes them and creates the releases, using the
      # CHANGESETS_OUTPUT report it passes to the CLI. The publish script must not wrap or replace that call.
      - uses: changesets/action@v2.1.2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          create-github-releases: true
          pr-title: 'chore(release): version packages'
          commit-message: 'chore(release): version packages'
        env:
          # The version PR and its pushes are made with this token. A repo secret holding a PAT or GitHub App token makes
          # them come from a real identity, so CI starts on its own; with `GITHUB_TOKEN` (github-actions[bot]) the CI
          # runs on changeset-release/main stop at action_required until someone approves them. Without the secret this
          # falls back to GITHUB_TOKEN, so the workflow keeps working. Publishing authenticates with OIDC, not this token.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
