name: Release

on:
  push:
    branches: [ main ]
  # Lets a release be retried from the Actions tab (runs that fail to start cannot be re-run).
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # Lets the job start the CI workflow on the version PR branch (see the last step).
  actions: write
  # npm trusted publishing and provenance authenticate with the workflow OIDC token (no npm token).
  id-token: write

jobs:
  release:
    name: Version PR or publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # No scripts: nothing here builds an app. Publishing only needs the workspace manifests and the Changesets CLI.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # v2 is the line that works with @changesets/cli v3. v1 looked for "New tag:" in the publish output, which the
      # v3 CLI no longer prints, so it published but created no GitHub releases.
      # `changeset publish` creates the tags on the runner and the action pushes them and creates the releases, using the
      # CHANGESETS_OUTPUT report it passes to the CLI. The publish script must not wrap or replace that call.
      - id: changesets
        uses: changesets/action@v2.1.2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          create-github-releases: true
          pr-title: 'chore(release): version packages'
          commit-message: 'chore(release): version packages'
        env:
          NPM_CONFIG_PROVENANCE: 'true'

      # Runs started by the version PR's own pull_request event wait at action_required for someone to approve them, so
      # the required "Lint and test" check never starts by itself. A workflow_dispatch run started with GITHUB_TOKEN is
      # allowed and needs no approval, and reports the same check on the PR's head commit.
      - name: Run CI on the version PR
        if: steps.changesets.outputs.hasChangesets == 'true'
        run: gh workflow run ci.yml --ref changeset-release/main
        env:
          GH_TOKEN: ${{ github.token }}
