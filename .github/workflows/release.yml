name: Release

on:
  push:
    branches: [ main ]
  # Lets a release be retried from the Actions tab (runs that fail to start cannot be re-run).
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # npm trusted publishing and provenance authenticate with the workflow OIDC token (no npm token).
  id-token: write

jobs:
  release:
    name: Version PR or publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # No scripts: nothing here builds an app. Publishing only needs the workspace manifests and the Changesets CLI.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: changesets/action@v1.9.0
        with:
          version: pnpm version-packages
          # `changeset publish` creates the tags on the runner only; push them, or they are lost with it.
          # changesets/action splits this string itself and only understands double quotes, so single quotes reach sh unbalanced.
          publish: sh -c "pnpm release && git push origin --tags"
          createGithubReleases: true
          title: 'chore(release): version packages'
          commit: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
