packages:
  - 'packages-platform/*'
  - 'packages-product/*'
  - 'packages-fugue/*'
  - 'packages-fugue/fugue-workflow/playground'
  - 'packages-fugue/fugue-theme/playground'
  - 'packages-consumer/*'
  - 'templates/docus-site'
  - 'templates/fugue-content-site'

# pnpm 11+ reads these from pnpm-workspace.yaml only (.npmrc is auth/registry).
# Hoisted layout is required so Nuxt Content SQLite and @nuxtjs/i18n resolveModule
# (@intlify/* via @nuxt/kit) work under a monorepo install (Netlify + local).
engineStrict: true
nodeLinker: hoisted
dedupePeerDependents: true

# Last resort: see .cursor/rules/dependency-updates.mdc. Bump the parent first.
overrides:
  # @nuxt/content SSR queries break on h3 2.x. Remove once @nuxt/content supports h3 2.
  h3: 1.15.11

allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true
  vue-demi: true

catalogs:
  apps:
    nuxt: ^4.6.4
    '@nuxt/kit': ^4.6.4
    vue: ^3.5.46
    '@vue/server-renderer': ^3.5.46
    vue-router: ^5.5.1
  dev:
    '@types/node': ^26.6.6
    '@types/js-yaml': ^4.0.9
    typescript: ^6.0.3
    vite: ^8.3.8
    '@changesets/cli': ^3.0.3
    '@commitlint/cli': ^21.2.4
    '@commitlint/config-conventional': ^21.2.4
    '@antfu/eslint-config': ^10.0.0
    '@nuxt/eslint': ^1.17.0
    concurrently: ^10.0.7
    eslint: ^10.15.0
    open: ^11.0.4
    vue-tsc: ^3.3.14
  testing:
    '@playwright/test': ^1.65.1
    '@vitejs/plugin-vue': ^6.0.11
    '@nuxt/test-utils': ^4.4.0
    '@vitest/coverage-v8': ^5.1.1
    '@vitest/ui': ^5.1.1
    happy-dom: ^21.0.4
    msw: ^3.0.7
    vitest: ^5.1.1
  content:
    '@nuxt/content': ^3.17.0
    '@nuxtjs/i18n': ^10.6.0
    # OG worker resolves this from the docs app. Docus's copy is not visible there.
    '@takumi-rs/core': ^2.22.1
    better-sqlite3: ^12.11.1
    docus: ^5.15.0
    nuxt-studio: ^1.8.2
  validation:
    zod: ^4.6.7
    zod-to-json-schema: ^3.25.2
  utils:
    defu: ^6.1.7
    debug: ^4.4.3
    extend: ^3.0.2
    js-yaml: ^5.5.0
    slugify: ^1.6.9
    ufo: ^1.6.4
  ui:
    '@headlessui/vue': ^1.7.23
    '@iconify-json/lucide': ^1.2.157
    '@iconify-json/simple-icons': ^1.2.103
    '@iconify-json/streamline-sharp': ^1.2.0
    '@nuxt/icon': ^2.6.3
    '@nuxt/ui': ^4.13.0
    '@nuxtjs/tailwindcss': ^6.14.0
    '@pinia/nuxt': ^1.0.3
    '@vueuse/core': ^14.4.0
    '@vueuse/nuxt': ^14.4.0
    pinia: ^4.1.0
    tailwindcss: ^4.3.5

# pnpm 11: allowBuilds only (onlyBuiltDependencies removed upstream).

patchedDependencies:
  nuxt-studio@1.8.2: patches/nuxt-studio@1.8.2.patch
